name: Test services
description: >-
  Starts what the integration tests and .github/test-packages.sh run against,
  at the addresses they default to, and waits until each answers.
inputs:
  services:
    description: >-
      The services to start, separated by spaces: postgres, Postgres with
      logical replication; s3, an S3 store; iceberg, an Iceberg REST catalog
      keeping its tables in the store's iceberg bucket, so it needs s3; glue,
      moto's Glue; kafka, one KRaft node, in the container kafka; registry,
      Karapace as the schema registry, which keeps its schemas in Kafka, so it
      needs kafka; and kinesis, kinesis-mock on plain HTTP.
    default: postgres s3 iceberg glue kafka registry kinesis
runs:
  using: composite
  steps:
    - name: Postgres
      if: contains(format(' {0} ', inputs.services), ' postgres ')
      shell: bash
      run: |
        docker run -d --name postgres -p 5432:5432 \
          -e POSTGRES_USER=openetl -e POSTGRES_PASSWORD=openetl -e POSTGRES_DB=openetl \
          postgres:18 -c wal_level=logical
    - name: An S3 store
      if: contains(format(' {0} ', inputs.services), ' s3 ')
      shell: bash
      run: |
        docker network create iceberg
        docker run -d --name s3 --network iceberg -p 8333:8333 -e WEED_MASTER_VOLUME_GROWTH_COPY_1=1 \
          chrislusf/seaweedfs:4.51 server -dir=/data -s3 -s3.port=8333 -master.volumeSizeLimitMB=64
    - name: An Iceberg REST catalog
      if: contains(format(' {0} ', inputs.services), ' iceberg ')
      shell: bash
      run: |
        docker run -d --name iceberg --network iceberg -p 8181:8181 \
          -e CATALOG_WAREHOUSE=s3://iceberg/ -e CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO \
          -e CATALOG_S3_ENDPOINT=http://s3:8333 -e CATALOG_S3_PATH__STYLE__ACCESS=true \
          -e AWS_REGION=us-east-1 -e AWS_ACCESS_KEY_ID=openetl -e AWS_SECRET_ACCESS_KEY=openetl \
          apache/iceberg-rest-fixture:1.10.1
    - name: Glue
      if: contains(format(' {0} ', inputs.services), ' glue ')
      shell: bash
      run: docker run -d --name glue -p 5000:5000 motoserver/moto:5.2.5
    - name: Kafka
      if: contains(format(' {0} ', inputs.services), ' kafka ')
      shell: bash
      run: |
        docker network create kafka
        docker run -d --name kafka --network kafka -p 9092:9092 \
          -e KAFKA_NODE_ID=1 -e KAFKA_PROCESS_ROLES=broker,controller \
          -e KAFKA_LISTENERS=PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093 \
          -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://127.0.0.1:9092,INTERNAL://kafka:29092 \
          -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT \
          -e KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
          -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093 -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
          -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
          -e KAFKA_NUM_PARTITIONS=3 apache/kafka:4.3.2
    - name: A schema registry
      if: contains(format(' {0} ', inputs.services), ' registry ')
      shell: bash
      run: |
        until docker exec kafka /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1; do sleep 1; done
        docker run -d --name registry --network kafka -p 8081:8081 --entrypoint python3 \
          -e KARAPACE_KARAPACE_REGISTRY=true -e KARAPACE_BOOTSTRAP_URI=kafka:29092 -e KARAPACE_HOST=0.0.0.0 \
          -e KARAPACE_PORT=8081 -e KARAPACE_ADVERTISED_HOSTNAME=registry -e KARAPACE_GROUP_ID=karapace \
          -e KARAPACE_MASTER_ELIGIBILITY=true -e KARAPACE_TOPIC_NAME=_schemas -e KARAPACE_COMPATIBILITY=BACKWARD \
          ghcr.io/aiven-open/karapace:6.2.4 -m karapace
    - name: Kinesis
      if: contains(format(' {0} ', inputs.services), ' kinesis ')
      shell: bash
      run: |
        docker run -d --name kinesis -p 4568:4568 -e KINESIS_MOCK_PLAIN_PORT=4568 \
          -e CREATE_STREAM_DURATION=100ms -e SPLIT_SHARD_DURATION=100ms -e MERGE_SHARDS_DURATION=100ms \
          -e SHARD_LIMIT=100000 -e ON_DEMAND_STREAM_COUNT_LIMIT=10000 -e LOG_LEVEL=WARN \
          ghcr.io/etspaceman/kinesis-mock:0.6.2
    - name: Every one answers
      shell: bash
      env:
        SERVICES: ${{ inputs.services }}
      run: |
        has() { [[ " $SERVICES " == *" $1 "* ]]; }
        # Over TCP: while the image initializes, its server takes the socket
        # alone, and then restarts.
        if has postgres; then until docker exec postgres pg_isready -h 127.0.0.1 -U openetl > /dev/null 2>&1; do sleep 1; done; fi
        if has s3; then until curl -sf -o /dev/null -X PUT http://127.0.0.1:8333/iceberg; do sleep 1; done; fi
        if has iceberg; then until curl -sf -o /dev/null http://127.0.0.1:8181/v1/config; do sleep 1; done; fi
        if has glue; then until curl -sf -o /dev/null http://127.0.0.1:5000/moto-api/; do sleep 1; done; fi
        if has kafka; then until docker exec kafka /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1; do sleep 1; done; fi
        # Karapace answers reads before it's the primary that takes writes:
        # it's ready once it registers a schema.
        if has registry; then
          until curl -sf -o /dev/null -X POST -H 'Content-Type: application/vnd.schemaregistry.v1+json' \
            --data '{"schema": "\"string\""}' http://127.0.0.1:8081/subjects/openetl-ready/versions; do sleep 1; done
        fi
        if has kinesis; then until curl -sf -o /dev/null http://127.0.0.1:4568/healthcheck; do sleep 1; done; fi
