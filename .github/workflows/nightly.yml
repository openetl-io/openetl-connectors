name: nightly

# Runs ci on main, every package, and checks each package's newest released
# version, from its registry, ghcr.io/OWNER/openetl-connectors/PACKAGE, with
# the conformance kit of openetl's main: the CLI from openetl's edge image,
# which starts each connector as openetl's runner does. The checks are
# .github/test-packages.sh's, as ci runs them on what main would release. A
# package with no release yet is left out.
#
# A scheduled run that fails opens an issue, or comments on the one that's
# open, and one that passes closes it. A dispatched run touches no issue.
on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  main:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read

  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      released: ${{ steps.released.outputs.released }}
    steps:
      - uses: actions/checkout@v5
      - name: Each package's newest release
        id: released
        run: |
          args=()
          released=
          for f in */openetl-connector.yaml; do
            name=$(sed -n 's/^name: *//p' "$f")
            repository=$GITHUB_REPOSITORY/$name
            token=$(curl -fsS "https://ghcr.io/token?scope=repository:$repository:pull&service=ghcr.io" | jq -r '.token // ""' || true)
            # The highest version, in semantic version order: sort -V with a
            # prerelease's - as ~, which sorts before the end of a string.
            version=$(curl -fsS -H "Authorization: Bearer $token" "https://ghcr.io/v2/$repository/tags/list?n=1000" 2>/dev/null |
              jq -r '.tags[]?' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' |
              sed 's/-/~/' | sort -V | sed 's/~/-/' | tail -n 1 || true)
            if [ -z "$version" ]; then
              echo "::notice::$name has no release in ghcr.io/$repository; left out"
              continue
            fi
            args+=("$name=oci://ghcr.io/$repository:$version")
            released="$released${released:+, }$name $version"
          done
          [ ${#args[@]} -gt 0 ] || { echo "::error::no package has a release"; exit 1; }
          echo "ARGS=${args[*]}" >> "$GITHUB_ENV"
          echo "released=$released" >> "$GITHUB_OUTPUT"
          echo "Checked: $released." >> "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/openetl
      - uses: ./.github/actions/services
      - name: The releases, through the conformance kit
        run: |
          # shellcheck disable=SC2086
          .github/test-packages.sh $ARGS

  issue:
    needs: [main, conformance]
    if: >-
      always() && github.event_name == 'schedule' &&
      !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN: ${{ needs.main.result }}
      CONFORMANCE: ${{ needs.conformance.result }}
      RELEASED: ${{ needs.conformance.outputs.released }}
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TITLE: "nightly: ci on main or the released connectors failed"
    steps:
      - name: Open, update or close the issue
        run: |
          number=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --limit 500 --json number,title |
            jq -r --arg t "$TITLE" 'map(select(.title == $t)) | .[0].number // empty')
          what="ci on main: $MAIN. The released connectors (${RELEASED:-none found}) through the conformance kit of openetl's main: $CONFORMANCE."
          if [ "$MAIN" = success ] && [ "$CONFORMANCE" = success ]; then
            [ -z "$number" ] || gh issue close "$number" -R "$GITHUB_REPOSITORY" --comment "Passed again: $RUN"
          elif [ -n "$number" ]; then
            gh issue comment "$number" -R "$GITHUB_REPOSITORY" --body "Failed again: $RUN. $what"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$TITLE" --body "$(printf '%s\n\n%s\n\n%s' \
              "The nightly run failed: $RUN" "$what" \
              "A failure of the released connectors means openetl's main broke one, which a change in openetl fixes, or the checks in .github/test-packages.sh no longer fit a released version. The nightly closes this issue when it passes again.")"
          fi
