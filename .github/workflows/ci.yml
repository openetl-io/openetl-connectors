name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: openetl
          POSTGRES_PASSWORD: openetl
          POSTGRES_DB: openetl
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U openetl" --health-interval 2s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v5
        with:
          path: openetl-connectors
      # go.mod replaces the SDK with ../openetl/sdk/go.
      - uses: actions/checkout@v5
        with:
          repository: openetl-io/openetl
          ref: main
          path: openetl
          ssh-key: ${{ secrets.OPENETL_DEPLOY_KEY }}
      # A pull request takes the SDK from openetl's branch of its name, when
      # there is one, so a change across both repositories is checked whole.
      - name: SDK of the same branch
        if: github.event_name == 'pull_request'
        working-directory: openetl
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if git fetch --depth=1 origin "refs/heads/$BRANCH"; then
            git checkout --detach FETCH_HEAD
          else
            echo "openetl has no branch $BRANCH, so main's SDK"
          fi
      - uses: actions/setup-go@v6
        with:
          go-version-file: openetl-connectors/go.mod
          cache: false
      # Restores the last cache when go.sum changes; setup-go's starts over.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ hashFiles('openetl-connectors/go.sum') }}
          restore-keys: go-
      - name: Format
        working-directory: openetl-connectors
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        working-directory: openetl-connectors
        run: go vet -tags integration ./...
      # Each package's openetl-connector.yaml, checked by the openetl CLI.
      - name: Packages
        working-directory: openetl
        run: |
          go build -o "$RUNNER_TEMP/openetl" ./cmd/openetl
          cd ../openetl-connectors
          "$RUNNER_TEMP/openetl" connector validate --require author,logo,description,license postgres kafka kinesis iceberg s3
      # Services take no server flags, and CDC needs logical replication.
      - name: Logical replication
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U openetl -c "ALTER SYSTEM SET wal_level = logical"
          docker restart ${{ job.services.postgres.id }}
          until docker exec ${{ job.services.postgres.id }} pg_isready -U openetl; do sleep 1; done
      # The Iceberg destination's: an S3 store, an Iceberg REST catalog
      # keeping its tables in the store's iceberg bucket, and moto's Glue.
      # Services can't take the store's command.
      - name: Iceberg catalog
        run: |
          docker network create iceberg
          docker run -d --name s3 --network iceberg -p 8333:8333 -e WEED_MASTER_VOLUME_GROWTH_COPY_1=1 \
            chrislusf/seaweedfs:4.51 server -dir=/data -s3 -s3.port=8333 -master.volumeSizeLimitMB=64
          docker run -d --name iceberg --network iceberg -p 8181:8181 \
            -e CATALOG_WAREHOUSE=s3://iceberg/ -e CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO \
            -e CATALOG_S3_ENDPOINT=http://s3:8333 -e CATALOG_S3_PATH__STYLE__ACCESS=true \
            -e AWS_REGION=us-east-1 -e AWS_ACCESS_KEY_ID=openetl -e AWS_SECRET_ACCESS_KEY=openetl \
            apache/iceberg-rest-fixture:1.10.1
          docker run -d --name glue -p 5000:5000 motoserver/moto:5.2.5
          until curl -sf -o /dev/null -X PUT http://127.0.0.1:8333/iceberg; do sleep 1; done
          until curl -sf -o /dev/null http://127.0.0.1:8181/v1/config; do sleep 1; done
          until curl -sf -o /dev/null http://127.0.0.1:5000/moto-api/; do sleep 1; done
      # Kafka's: one KRaft node, and Karapace as the schema registry.
      - name: Kafka and a schema registry
        run: |
          docker network create kafka
          docker run -d --name kafka --network kafka -p 9092:9092 \
            -e KAFKA_NODE_ID=1 -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://127.0.0.1:9092,INTERNAL://kafka:29092 \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT \
            -e KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093 -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            -e KAFKA_NUM_PARTITIONS=3 apache/kafka:4.3.2
          until docker exec kafka /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1; do sleep 1; done
          docker run -d --name registry --network kafka -p 8081:8081 --entrypoint python3 \
            -e KARAPACE_KARAPACE_REGISTRY=true -e KARAPACE_BOOTSTRAP_URI=kafka:29092 -e KARAPACE_HOST=0.0.0.0 \
            -e KARAPACE_PORT=8081 -e KARAPACE_ADVERTISED_HOSTNAME=registry -e KARAPACE_GROUP_ID=karapace \
            -e KARAPACE_MASTER_ELIGIBILITY=true -e KARAPACE_TOPIC_NAME=_schemas -e KARAPACE_COMPATIBILITY=BACKWARD \
            ghcr.io/aiven-open/karapace:6.2.4 -m karapace
          until curl -sf -o /dev/null http://127.0.0.1:8081/subjects; do sleep 1; done
      # Kinesis's: kinesis-mock, on plain HTTP.
      - name: Kinesis
        run: |
          docker run -d --name kinesis -p 4568:4568 -e KINESIS_MOCK_PLAIN_PORT=4568 \
            -e CREATE_STREAM_DURATION=100ms -e SPLIT_SHARD_DURATION=100ms -e MERGE_SHARDS_DURATION=100ms \
            -e SHARD_LIMIT=100000 -e ON_DEMAND_STREAM_COUNT_LIMIT=10000 -e LOG_LEVEL=WARN \
            ghcr.io/etspaceman/kinesis-mock:0.6.2
          until curl -sf -o /dev/null http://127.0.0.1:4568/healthcheck; do sleep 1; done
      - name: Tests, against Postgres, the Iceberg catalogs, Kafka and Kinesis
        working-directory: openetl-connectors
        env:
          OPENETL_TEST_GLUE_ENDPOINT: http://127.0.0.1:5000
        run: go test -race -tags integration -count=1 ./...
      # What a release publishes, for this runner's platform, checked with
      # the conformance kit as anyone checks a package.
      - name: Packages, through the conformance kit
        working-directory: openetl-connectors
        env:
          OPENETL: ${{ runner.temp }}/openetl
        run: .github/test-packages.sh
