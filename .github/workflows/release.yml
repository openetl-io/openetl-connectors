name: release

# Releases one package when its tag is pushed: PACKAGE/vX.Y.Z, or a
# prerelease, PACKAGE/vX.Y.Z-alpha.N, -beta.N or -rc.N. The tag's commit must
# be in main or in a release branch, release-PACKAGE-X.Y (or release-X.Y), and
# ci must have passed on it; a run of ci still going on it is waited for. It
# packages that package alone, at the tag, for Linux on amd64 and arm64,
# pushes it to ghcr.io/OWNER/openetl-connectors/PACKAGE, and puts its files on
# a draft release, with notes generated from the pull requests since the
# package's previous tag. Then the job that alone can sign, in the release environment,
# signs the package and its checksums with keyless cosign and publishes the
# release, a prerelease when the version has a suffix. Running it again
# replaces the draft; it refuses a version that's released. The SDK is the
# version go.mod requires, and the openetl CLI the one ci uses, main's
# (.github/actions/openetl).
#
# Dispatched on a branch, it's a dry run of the tag given: it packages that
# package at the branch's head and runs the checks, which only warn, and
# pushes, uploads and signs nothing.
#
# GHCR creates a package private: after a package's first release, make it
# public in its settings, once; the run's summary says so. One job builds and
# uploads, so no build passes through a workflow artifact, which on a public
# repository anyone signed in can download. Actions are pinned by commit.
on:
  push:
    tags:
      - "*/v[0-9]+.[0-9]+.[0-9]+"
      - "*/v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      tag:
        description: The tag a push would release, such as postgres/v0.2.0-alpha.1; packaged at this branch's head, and nothing is published
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read # the commit's ci
      contents: write # the draft, which only a token that can write sees
      packages: write
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      package: ${{ steps.check.outputs.package }}
      version: ${{ steps.check.outputs.version }}
      published: ${{ steps.publish.outputs.published }}
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      DRY_RUN: ${{ github.event_name != 'push' }}
      NAMESPACE: oci://ghcr.io/${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: The tag names a package's version
        run: |
          re='^([a-z0-9][a-z0-9-]*)/v([0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?)$'
          [[ "$TAG" =~ $re ]] || { echo "::error::$TAG isn't a tag such as postgres/v0.2.0 or postgres/v0.2.0-alpha.1"; exit 1; }
          { echo "PACKAGE=${BASH_REMATCH[1]}"; echo "VERSION=${BASH_REMATCH[2]}"
            echo "DIST=$RUNNER_TEMP/dist"; } >> "$GITHUB_ENV"
      # The tag, or on a dry run the branch.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: openetl-connectors
      # openetl's notices tool, which lists the connectors' third-party
      # dependencies and their licenses.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: openetl-io/openetl
          ref: main
          path: openetl
          sparse-checkout: internal/notices
      - name: This tag can be released
        id: check
        working-directory: openetl-connectors
        run: |
          # On a dry run, a check that fails only warns.
          fail() {
            if [ "$DRY_RUN" = true ]; then echo "::warning::$1"; else echo "::error::$1"; exit 1; fi
          }
          commit=$(git rev-parse HEAD)
          grep -qx "name: $PACKAGE" ./*/openetl-connector.yaml 2>/dev/null ||
            { echo "::error::no openetl-connector.yaml here names the package $PACKAGE"; exit 1; }

          # Whether the commit is in branch $1.
          has() {
            case $(gh api "repos/$GITHUB_REPOSITORY/compare/$1...$commit" --jq .status 2>/dev/null || true) in
              identical | behind) return 0 ;;
              *) return 1 ;;
            esac
          }
          on=
          branches=$(gh api --paginate "repos/$GITHUB_REPOSITORY/branches" --jq '.[].name | select(test("^release-([a-z0-9-]+-)?[0-9]+\\.[0-9]+$"))')
          for b in main $branches; do
            if has "$b"; then on=$b; break; fi
          done
          [ -n "$on" ] || fail "$TAG ($commit) isn't a commit in main or in a release branch, release-PACKAGE-X.Y"

          # ci on the commit: passed, or still running, which is waited for
          # up to an hour.
          deadline=$((SECONDS + 3600))
          while :; do
            runs=$(gh run list -R "$GITHUB_REPOSITORY" -w ci.yml -c "$commit" --json status,conclusion)
            if jq -e 'any(.[]; .conclusion == "success")' <<<"$runs" > /dev/null; then break; fi
            if [ "$DRY_RUN" != true ] && [ "$SECONDS" -lt "$deadline" ] && jq -e 'any(.[]; .status != "completed")' <<<"$runs" > /dev/null; then
              echo "ci is running on $commit; waiting for it"
              sleep 60
              continue
            fi
            fail "ci hasn't passed on $commit"
            break
          done

          draft=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          [ "$draft" != false ] || fail "$TAG is already released"
          { echo "COMMIT=$commit"; echo "DRAFT=$draft"; } >> "$GITHUB_ENV"
          { echo "tag=$TAG"; echo "package=$PACKAGE"; echo "version=$VERSION"; } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: openetl-connectors/go.mod
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-release-${{ hashFiles('openetl-connectors/go.sum') }}
          restore-keys: go-release-
      # The CLI ci checks the packages with.
      - uses: ./openetl-connectors/.github/actions/openetl
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - if: env.DRY_RUN != 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Package it for Linux
        run: |
          cd openetl-connectors
          GOFLAGS="'-ldflags=-s -w'" "$OPENETL" connector package --tag "$TAG" --out "$DIST" --platforms linux/amd64,linux/arm64
          ls -l "$DIST"
      # The notices cover every connector's dependencies, a superset of this
      # package's.
      - name: The notices, SBOMs and checksums
        run: |
          go -C openetl run ./internal/notices -connectors-only -connectors "$PWD/openetl-connectors" -connectors-work off \
            -out "$DIST/THIRD-PARTY-NOTICES.txt"
          for f in "$DIST/$PACKAGE"-*-linux-*; do
            syft "file:$f" -o "spdx-json=$f.sbom.json"
          done
          (cd "$DIST" && sha256sum "$PACKAGE"-* "$PACKAGE.connector.yaml" > "$PACKAGE.checksums.txt")
      - name: The package
        id: publish
        if: env.DRY_RUN != 'true'
        run: |
          "$OPENETL" connector publish "$NAMESPACE" "$DIST/$PACKAGE.connector.yaml" | tee "$RUNNER_TEMP/published.txt"
          "$OPENETL" connector validate --artifact "$NAMESPACE/$PACKAGE:$VERSION"
          # The line is "NAME VERSION: oci://REPOSITORY@DIGEST (indexed)".
          published=$(sed -nE 's/^[^:]+: oci:\/\/([^ ]+@sha256:[0-9a-f]+) .*/\1/p' "$RUNNER_TEMP/published.txt")
          [ -n "$published" ] || { echo "::error::publish didn't print the package's digest"; exit 1; }
          echo "published=$published" >> "$GITHUB_OUTPUT"
          echo "Package: \`$published\`" >> "$GITHUB_STEP_SUMMARY"
      - name: A draft release
        if: env.DRY_RUN != 'true'
        run: |
          [ "$DRAFT" != true ] || gh release delete "$TAG" -R "$GITHUB_REPOSITORY" --yes
          prerelease=()
          [[ "$VERSION" != *-* ]] || prerelease=(--prerelease)
          # The notes start at the package's previous version among its tags,
          # in semantic version order: sort -V with a prerelease's - as ~,
          # which sorts before the end of a string.
          previous=$( { git ls-remote --tags --refs "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "refs/tags/$PACKAGE/v*" |
            sed -n "s|.*refs/tags/$PACKAGE/v||p"; echo "$VERSION"; } | grep -E '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' |
            sed 's/-/~/' | sort -V | sed 's/~/-/' | grep -x -B1 -F "$VERSION" | head -n 1 || true)
          start=()
          [ -z "$previous" ] || [ "$previous" = "$VERSION" ] || start=(--notes-start-tag "$PACKAGE/v$previous")
          notes="The $PACKAGE connector, version $VERSION, from commit $COMMIT, for Linux on amd64 and arm64. Apply it with \`openetl connector apply $NAMESPACE/$PACKAGE:$VERSION\`, or \`openetl connector apply github.com/$GITHUB_REPOSITORY/$PACKAGE@$VERSION\` from this release. \`$PACKAGE.checksums.txt\` lists each file's SHA-256; it and the package are signed with keyless cosign by this repository's release workflow."
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --draft "${prerelease[@]}" \
            --title "$PACKAGE v$VERSION" --notes "$notes" --generate-notes "${start[@]}" \
            "$DIST/$PACKAGE"-* "$DIST/$PACKAGE.connector.yaml" "$DIST/$PACKAGE.checksums.txt" "$DIST/THIRD-PARTY-NOTICES.txt"

  # The only job that can sign, in the release environment.
  publish:
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      TAG: ${{ needs.package.outputs.tag }}
      PACKAGE: ${{ needs.package.outputs.package }}
      VERSION: ${{ needs.package.outputs.version }}
      PUBLISHED: ${{ needs.package.outputs.published }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Sign the package and its checksums
        run: |
          cosign sign --yes "$PUBLISHED"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "$PACKAGE.checksums.txt" -D sig
          cosign sign-blob --yes --bundle "sig/$PACKAGE.checksums.txt.sigstore.json" "sig/$PACKAGE.checksums.txt"
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber "sig/$PACKAGE.checksums.txt.sigstore.json"
      - name: Publish the release
        run: |
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false
          echo "Released: $(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
      - name: Anyone can pull the package
        run: |
          # The package's version, and its card in the index.
          for p in "$PACKAGE:$VERSION" "index:$PACKAGE"; do
            repository=$GITHUB_REPOSITORY/${p%%:*}
            t=$(curl -s "https://ghcr.io/token?scope=repository:$repository:pull&service=ghcr.io" | jq -r '.token // ""')
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $t" \
              -H 'Accept: application/vnd.oci.image.manifest.v1+json' "https://ghcr.io/v2/$repository/manifests/${p#*:}")
            if [ "$code" != 200 ]; then
              settings="https://github.com/orgs/$GITHUB_REPOSITORY_OWNER/packages/container/${GITHUB_REPOSITORY#*/}%2F${p%%:*}/settings"
              echo "::warning::ghcr.io/$repository is private: make it public in $settings"
              echo "**ghcr.io/$repository is private:** make it public in [its settings]($settings)." >> "$GITHUB_STEP_SUMMARY"
            fi
          done
