name: backport

# Backports a merged pull request to a release line's branch. Label a pull
# request `backport release-X.Y`, before it's merged or after, and once it's
# merged this opens a pull request of it against release-X.Y: what merging it
# put on its base branch, cherry-picked with -x, with its title and the
# branch's name after it. Where that doesn't apply cleanly, it comments on the
# pull request with the commands to backport it by hand. CONTRIBUTING.md has
# when to backport.
#
# It runs on pull_request_target, with a token that can write, so it never
# runs the pull request's code: it only cherry-picks commits merging it made.
#
# It pushes with the deploy key in the secret BACKPORT_DEPLOY_KEY, as GitHub
# starts no workflow for what a workflow's own token pushes, and CI is to run
# on the backport. Without the key it pushes with the workflow's token, and CI
# runs once the backport is merged. Opening the pull request needs "Allow
# GitHub Actions to create and approve pull requests" in the repository's
# Actions settings; without it, the comment links to opening it.
#
# openetl and openetl-connectors have the same file.
on:
  pull_request_target:
    types: [closed, labeled]

permissions: {}

jobs:
  backport:
    if: >-
      github.event.pull_request.merged &&
      (github.event.action == 'closed' || startsWith(github.event.label.name, 'backport '))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: backport-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          ssh-key: ${{ secrets.BACKPORT_DEPLOY_KEY }}
      - name: Backport to each release branch it's labelled for
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
          COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # What merging put on the base branch, to cherry-pick: a merge
          # commit, against its first parent; the pull request's commits, if
          # they were rebased onto it; or the commit they were squashed into.
          picks=("$COMMIT")
          if [ "$(git rev-list --no-walk --parents "$COMMIT" | wc -w)" -gt 2 ]; then
            picks=(-m 1 "$COMMIT")
          elif [ "$COMMITS" -gt 1 ]; then
            git fetch --quiet origin "refs/pull/$PR/head"
            patch() { git show "$1" | git patch-id --stable | cut -d' ' -f1; }
            head=$(patch FETCH_HEAD)
            if [ -n "$head" ] && [ "$head" = "$(patch "$COMMIT")" ]; then
              picks=("$COMMIT~$COMMITS..$COMMIT")
            fi
          fi

          comment() { gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body "$1"; }

          # What to run to backport by hand, when the cherry-pick conflicts.
          by_hand() {
            printf '%s\n' \
              "This doesn't apply cleanly to \`$1\`. To backport it by hand:" \
              '' \
              '```sh' \
              'git fetch origin' \
              "git switch -c $2 origin/$1" \
              "git cherry-pick -x ${picks[*]}" \
              '# Resolve the conflicts, then: git cherry-pick --continue' \
              "git push -u origin $2" \
              "gh pr create --base $1 --fill" \
              '```'
          }

          if [ "$ACTION" = labeled ]; then
            labels=$LABEL
          else
            labels=$(jq -r '.[]' <<< "$LABELS")
          fi

          while IFS= read -r label; do
            case $label in "backport "*) ;; *) continue ;; esac
            target=${label#backport }
            if ! [[ $target =~ ^release-[0-9]+\.[0-9]+$ ]]; then
              comment "\`$label\` names no release line's branch, such as \`release-0.1\`."
              continue
            fi
            if ! git rev-parse --verify --quiet "refs/remotes/origin/$target" > /dev/null; then
              comment "There's no branch \`$target\` to backport this to."
              continue
            fi
            branch=backport/$PR-$target
            if git rev-parse --verify --quiet "refs/remotes/origin/$branch" > /dev/null; then
              echo "$branch exists: backported already"
              continue
            fi

            git switch --quiet -c "$branch" "origin/$target"
            if ! git cherry-pick -x --empty=drop "${picks[@]}"; then
              git cherry-pick --abort
              comment "$(by_hand "$target" "$branch")"
            elif [ "$(git rev-list --count "origin/$target..HEAD")" = 0 ]; then
              echo "$target has this change already"
            else
              git push --quiet origin "$branch"
              if ! gh pr create -R "$GITHUB_REPOSITORY" --base "$target" --head "$branch" --title "$TITLE ($target)" --body "Backports #$PR to \`$target\`."; then
                comment "Backported to \`$branch\`, which needs [a pull request](https://github.com/$GITHUB_REPOSITORY/compare/$target...$branch?expand=1) against \`$target\`."
              fi
            fi
            git switch --quiet --detach "$COMMIT"
          done <<< "$labels"
